<!--
  One chapter per country. Row types inside a chapter:
    figure.wide            one landscape photo across the column
    div.pair               two photos at equal height; each figure sets --ar (width / height)
    figure.solo.solo-left  one portrait photo with its caption beside it (also .solo-right); set --ar
  data-place on a figure is the city; it appears in small type under the photo and is collected
  automatically into the list next to the chapter title. Leave it out where the country says enough
  (as for Singapore).
  To add a photo: put NAME.jpg (long side ~2000px) and NAME_thumb.jpg (long side ~800px) in photos/,
  copy a figure, and update the file names, --ar, width/height, data-place and caption.
  To add a country: copy a whole <section class="chapter">. Remove location data from photos before uploading.
-->

<!-- Full-screen viewer -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lb-btn lb-close" type="button" aria-label="Close">&#x2715;</button>
  <button class="lb-btn lb-prev" type="button" aria-label="Previous photo">&lsaquo;</button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-btn lb-next" type="button" aria-label="Next photo">&rsaquo;</button>
</div>

<script>
  // Fill the small city list next to each chapter title from the photos inside it.
  Array.prototype.forEach.call(document.querySelectorAll(".chapter"), function (ch) {
    var seen = [];
    Array.prototype.forEach.call(ch.querySelectorAll("figure[data-place]"), function (f) {
      var c = f.getAttribute("data-place");
      if (seen.indexOf(c) < 0) seen.push(c);
    });
    var el = ch.querySelector(".cities");
    if (el) { if (seen.length) el.textContent = seen.join(", "); else el.remove(); }
  });

  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll(".chapter figure > a"));
    var box = document.getElementById("lightbox");
    var img = document.getElementById("lb-img");
    var cap = document.getElementById("lb-cap");
    var closeBtn = box.querySelector(".lb-close");
    var idx = 0, opener = null;

    function show(i) {
      idx = (i + links.length) % links.length;
      var a = links[idx];
      var fig = a.parentNode;
      var place = fig.getAttribute("data-place") || fig.closest(".chapter").getAttribute("data-country");
      var em = fig.querySelector("figcaption em");
      var title = em ? em.textContent : fig.querySelector("figcaption").textContent;
      img.src = a.getAttribute("href");
      img.alt = a.querySelector("img").alt;
      cap.textContent = place && place !== title ? title + ", " + place : title;
    }
    function open(i) {
      opener = links[i];
      show(i);
      box.hidden = false;
      document.body.style.overflow = "hidden";
      closeBtn.focus();
    }
    function close() {
      box.hidden = true;
      img.removeAttribute("src");
      document.body.style.overflow = "";
      if (opener) opener.focus();
    }

    links.forEach(function (a, i) {
      a.addEventListener("click", function (e) { e.preventDefault(); open(i); });
    });
    closeBtn.addEventListener("click", close);
    box.querySelector(".lb-prev").addEventListener("click", function () { show(idx - 1); });
    box.querySelector(".lb-next").addEventListener("click", function () { show(idx + 1); });
    box.addEventListener("click", function (e) { if (e.target === box) close(); });
    document.addEventListener("keydown", function (e) {
      if (box.hidden) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") show(idx - 1);
      if (e.key === "ArrowRight") show(idx + 1);
    });
  })();
</script>
